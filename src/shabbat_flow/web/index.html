<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shabbat Flow</title><link rel="stylesheet" href="./style.css?v=print-font-1">
  <script type="module" src="/app.mjs"></script>
</head>
<body>
<header class="topbar"><a href="/" class="brand" aria-label="Shabbat Flow"><img class="brand-logo" src="/logo.png" alt="Shabbat Flow" width="2172" height="724"></a><label class="language"><span data-i18n="language">Language / שפה</span><select id="language"><option value="en">English</option><option value="he">עברית</option></select></label></header>
<main>
  <p><a href="/v2" data-i18n="v2_preview_link">Try the multi-day and room-use preview</a></p>
  <section class="intro"><div><span class="badge" data-i18n="preview_badge">PREVIEW ONLY / תצוגה מקדימה בלבד</span><h1 data-i18n="tagline">A peaceful Shabbat starts with a plan.</h1><p data-i18n="sample_notice">Fictional sample home · No devices connected or controlled.</p></div><span class="sun" aria-hidden="true">☀</span></section>
  <div id="status" role="status" aria-live="polite"></div>
  <form id="planner" novalidate>
  <div class="grid">
    <section class="card"><h2 data-i18n="home_title"></h2><label class="toggle"><span data-i18n="home"></span><input type="checkbox" id="home"></label><h3 data-i18n="rooms_title"></h3><p class="hint" data-i18n="rooms_hint"></p><div id="rooms"></div></section>
    <section class="card"><h2 data-i18n="meals_title"></h2><label class="field"><span data-i18n="dinner"></span><select id="dinner"><option value="away" data-i18n="away"></option><option value="family" data-i18n="family"></option><option value="hosting" data-i18n="hosting"></option></select></label><label class="field"><span data-i18n="lunch"></span><select id="lunch"><option value="away" data-i18n="away"></option><option value="family" data-i18n="family"></option><option value="hosting" data-i18n="hosting"></option></select></label></section>
    <section class="card"><h2 data-i18n="timing_title"></h2><p class="hint" data-i18n="timing_hint"></p><div id="offsets"></div></section>
    <section class="card"><h2 data-i18n="anchors_title"></h2><p class="hint" data-i18n="anchors_hint"></p><label class="field"><span data-i18n="timezone"></span><input id="timezone" dir="ltr" type="text" maxlength="100"></label><label class="field"><span data-i18n="candle_lighting"></span><input id="candle_lighting" dir="ltr" type="text" maxlength="40"></label><label class="field"><span data-i18n="sunrise"></span><input id="sunrise" dir="ltr" type="text" maxlength="40"></label><label class="field"><span data-i18n="end"></span><input id="end" dir="ltr" type="text" maxlength="40"></label></section>
  </div>
  <div class="toolbar"><button class="primary" type="submit" data-i18n="preview"></button><button id="save" type="button" data-i18n="save"></button><button id="load" type="button" data-i18n="load"></button><button id="delete" type="button" data-i18n="delete"></button><button id="reset" type="button" data-i18n="reset"></button></div>
  </form>
  <section class="card schedule"><div class="section-heading"><div><h2 data-i18n="timeline"></h2><p class="hint" data-i18n="timeline_hint"></p></div><span id="count" class="count"></span></div><div id="timeline"></div><button id="export" disabled data-i18n="export"></button><p class="hint" data-i18n="export_notice"></p></section>
  <details class="card"><summary data-i18n="details"></summary><p data-i18n="limits"></p></details>
</main>
<noscript>JavaScript is required for this local preview. / יש להפעיל JavaScript לתצוגה המקומית.</noscript>
</body>
</html>
