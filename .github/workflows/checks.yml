name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: PYTHONPATH=src python3 -m unittest discover -s tests -v
      - run: node --test tests/web.test.mjs
      - run: python3 scripts/check_repository.py
      - run: python3 scripts/build_ha.py --check --zip
      - uses: actions/upload-artifact@v4
        with:
          name: shabbat-flow-preview
          path: dist/*
  ha-compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ha: ['2026.8.2', '2026.11.2']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install homeassistant==${{ matrix.ha }} pytest==9.2.0 pytest-asyncio==1.5.0
      - run: python -m pytest tests/ha -q -o asyncio_default_fixture_loop_scope=function
